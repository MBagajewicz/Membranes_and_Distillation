[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "HFM-Simulator"
version = "0.5.0"

description = "Hollow fiber membrane gas permeation simulator: multicomponent mass and energy balances with bore/shell pressure drop, real-gas fugacity and a fall-through solver ladder"
authors = [
    {name = "João Victor Abdala Tupinambá"},
    {name = "Oliva D.G."},
    {name = "Sabrina De Abreu"},
    {name = "Argimiro Resende Secchi"},
    {name = "Bagajewicz M.J."}
]

readme = "README.md"

requires-python = ">=3.10"

# Declared dependencies are exactly what the package imports.
#   numpy, scipy    -- balances and solvers
#   openpyxl        -- Simulator_Results_HFM's spreadsheet export. This was
#                      MISSING, so export_to_excel raised ImportError on a
#                      clean install.
#   Common-Library  -- Streams, MembranePermeance, MixtureProperties; it is
#                      what brings CoolProp in transitively.
# pandas was declared but is not imported anywhere in src/. It is used by
# Calculations_HFM_Simulation_Results.py, which lives OUTSIDE this package, so
# that consumer declares it -- not the library.
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
    "Common-Library"
]

[tool.setuptools.packages.find]
where = ["src"]